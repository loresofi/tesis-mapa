<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Muestras Geologicas — UNINORTE</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"/>
<style>
:root{--rojo:#e63946;--amarillo:#f4b400;--verde:#2a9d3f;--gris:#8a8a8a;--azul:#1d3557;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;font-family:'Segoe UI',Arial,sans-serif;color:#222;overflow:hidden;}

/* ---- NAV PRINCIPAL ---- */
#mainNav{position:fixed;top:0;left:0;right:0;z-index:2500;
  background:linear-gradient(135deg,#1d3557,#264653);color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;height:50px;box-shadow:0 2px 8px rgba(0,0,0,.3);flex-wrap:nowrap;gap:8px;}
#mainNav h1{font-size:.9rem;margin:0;font-weight:600;white-space:nowrap;flex:1;}
.nav-tabs{display:flex;gap:0;flex-shrink:0;}
.nav-tab{padding:14px 18px;border:none;background:rgba(255,255,255,.1);color:#fff;
  cursor:pointer;font-size:.83rem;font-weight:600;border-bottom:3px solid transparent;
  transition:all .2s;height:50px;}
.nav-tab:hover{background:rgba(255,255,255,.2);}
.nav-tab.active{background:rgba(255,255,255,.15);border-bottom-color:#fff;}
#counter{font-size:.75rem;background:rgba(255,255,255,.1);padding:4px 10px;
  border-radius:8px;white-space:nowrap;flex-shrink:0;}

/* ---- PAGINAS ---- */
.page{position:fixed;top:50px;left:0;right:0;bottom:0;display:none;overflow:hidden;}
.page.active{display:flex;}

/* ---- MAPA ---- */
#page-map{flex-direction:column;}
#map{flex:1;width:100%;}

/* ---- TOGGLE FILTROS ---- */
#toggleFilters{position:absolute;top:10px;left:10px;z-index:1100;
  background:#fff;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;
  box-shadow:0 2px 6px rgba(0,0,0,.3);font-weight:600;font-size:.85rem;}

/* ---- PANEL FILTROS (mapa) ---- */
#filterPanel{position:absolute;top:54px;left:10px;z-index:1100;width:280px;
  max-height:calc(100% - 80px);overflow-y:auto;background:#fff;border-radius:10px;
  padding:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:.82rem;}
#filterPanel.hidden{display:none;}
#filterPanel h3{margin:0 0 8px;font-size:.9rem;color:#1d3557;
  border-bottom:2px solid #e0e0e0;padding-bottom:6px;}
#filterPanel label{display:block;margin:8px 0 3px;font-weight:600;color:#333;}
#filterPanel select,#filterPanel input[type=text]{
  width:100%;padding:6px 8px;border:1px solid #ccc;border-radius:6px;font-size:.82rem;}
.chk-row{display:flex;align-items:center;gap:6px;margin-top:6px;}
.chk-row label{margin:0;font-weight:500;}
#resetBtn{margin-top:12px;width:100%;padding:7px;background:#264653;color:#fff;
  border:none;border-radius:6px;cursor:pointer;font-weight:600;}
#resetBtn:hover{background:#1d3557;}

/* ---- LEYENDA ---- */
.legend{background:#fff;padding:10px 12px;border-radius:8px;
  box-shadow:0 2px 8px rgba(0,0,0,.3);font-size:.78rem;line-height:1.5;max-width:230px;}
.legend h4{margin:0 0 6px;font-size:.85rem;color:#1d3557;}
.legend .item{display:flex;align-items:center;gap:6px;margin:2px 0;}
.legend .dot{width:14px;height:14px;border-radius:50%;display:inline-block;
  border:2px solid #333;flex-shrink:0;}
.legend .dot.approx{border:2px dashed #000;}

/* ---- POPUP ---- */
.popup-content{font-size:.82rem;line-height:1.5;max-width:270px;}
.popup-content table{width:100%;border-collapse:collapse;}
.popup-content td{padding:2px 4px;vertical-align:top;}
.popup-content td.k{font-weight:600;color:#1d3557;white-space:nowrap;}
.popup-content .warn{background:#fff3cd;border:1px solid #ffe69c;color:#7a5b00;
  padding:5px 7px;border-radius:6px;margin-top:6px;font-size:.78rem;}
.popup-content .ok{background:#d4edda;border:1px solid #b7dfc0;color:#155724;
  padding:5px 7px;border-radius:6px;margin-top:6px;font-size:.78rem;}
.popup-content .analysis{margin-top:5px;font-size:.78rem;color:#0a6b2c;font-weight:600;}
.btn-detalle{display:block;margin-top:10px;padding:7px 12px;background:#1d3557;
  color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.82rem;
  font-weight:600;width:100%;text-align:center;}
.btn-detalle:hover{background:#264653;}

/* ---- MODAL FICHA ---- */
#modalOverlay{display:none;position:fixed;inset:0;z-index:3000;
  background:rgba(0,0,0,.65);align-items:center;justify-content:center;}
#modalOverlay.open{display:flex;}
#modal{background:#fff;border-radius:12px;width:92vw;max-width:860px;
  max-height:92vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.4);}
#modalHeader{background:linear-gradient(135deg,#1d3557,#264653);color:#fff;
  padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-shrink:0;}
#modalTitle{font-size:1rem;font-weight:700;line-height:1.3;}
#modalSubtitle{font-size:.8rem;opacity:.85;margin-top:3px;}
#closeModal{background:rgba(255,255,255,.2);border:none;color:#fff;
  border-radius:50%;width:32px;height:32px;font-size:1.1rem;cursor:pointer;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;}
#closeModal:hover{background:rgba(255,255,255,.35);}
.tab-bar{display:flex;background:#f0f0f0;border-bottom:2px solid #ddd;flex-shrink:0;flex-wrap:wrap;}
.tab-btn{padding:10px 16px;border:none;background:none;cursor:pointer;
  font-size:.8rem;font-weight:600;color:#555;border-bottom:3px solid transparent;
  margin-bottom:-2px;transition:all .2s;}
.tab-btn.active{color:#1d3557;border-bottom-color:#1d3557;background:#fff;}
.tab-btn:hover:not(.active){background:#e8e8e8;}
.tab-content{display:none;overflow-y:auto;padding:18px;flex:1;}
.tab-content.active{display:block;}

/* ---- GALERIA ---- */
.gallery{position:relative;background:#111;border-radius:8px;overflow:hidden;
  max-height:380px;display:flex;align-items:center;justify-content:center;}
.gallery img{max-width:100%;max-height:380px;object-fit:contain;display:block;}
.gallery-nav{position:absolute;top:50%;transform:translateY(-50%);
  background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;
  width:36px;height:36px;font-size:1.1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;}
.gallery-nav:hover{background:rgba(0,0,0,.75);}
#galleryPrev{left:8px;} #galleryNext{right:8px;}
.gallery-counter{text-align:center;font-size:.78rem;color:#777;margin-top:6px;}
.gallery-thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
.gallery-thumbs img{width:58px;height:58px;object-fit:cover;border-radius:5px;
  cursor:pointer;opacity:.6;border:2px solid transparent;transition:all .15s;}
.gallery-thumbs img.active{opacity:1;border-color:#1d3557;}
.no-photos{text-align:center;padding:40px 20px;color:#888;font-size:.9rem;}

/* ---- LAMINAS DELGADAS ---- */
.lamina-pair{display:flex;gap:10px;margin-bottom:14px;align-items:flex-start;}
.lamina-pair .lam-col{flex:1;text-align:center;}
.lamina-pair .lam-col img{width:100%;border-radius:6px;border:1px solid #ddd;
  max-height:260px;object-fit:contain;}
.lamina-pair .lam-label{font-size:.75rem;font-weight:600;color:#555;margin-top:4px;}
.lamina-nav{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.lamina-nav button{padding:6px 14px;border:1px solid #ccc;background:#fff;
  border-radius:6px;cursor:pointer;font-size:.82rem;}
.lamina-nav button:hover{background:#f0f0f0;}
.lamina-counter{font-size:.8rem;color:#666;}

/* ---- DRX PANEL ---- */
.drx-img{text-align:center;margin-bottom:16px;}
.drx-img img{max-width:100%;border-radius:8px;border:1px solid #ddd;}
.drx-img-placeholder{background:#f5f5f5;border:2px dashed #ccc;border-radius:8px;
  padding:30px;text-align:center;color:#999;font-size:.85rem;}
.mineral-table{width:100%;border-collapse:collapse;font-size:.8rem;margin:12px 0;}
.mineral-table th{background:#1d3557;color:#fff;padding:6px 8px;text-align:left;}
.mineral-table td{padding:5px 8px;border-bottom:1px solid #eee;vertical-align:top;}
.mineral-table tr:nth-child(even) td{background:#f8f8f8;}
.section-title{font-size:.87rem;font-weight:700;color:#1d3557;margin:16px 0 6px;
  padding-bottom:4px;border-bottom:2px solid #e0e0e0;}
.description-box{background:#f9f9f9;border-left:3px solid #264653;padding:10px 12px;
  border-radius:0 6px 6px 0;font-size:.8rem;line-height:1.6;color:#333;}
.interpretacion-box{background:#fffbf0;border-left:3px solid #f4b400;padding:10px 12px;
  border-radius:0 6px 6px 0;font-size:.8rem;line-height:1.6;color:#333;}
.nota-box{background:#e8f5e9;border-left:3px solid #2a9d3f;padding:10px 12px;
  border-radius:0 6px 6px 0;font-size:.8rem;line-height:1.6;color:#333;margin-top:12px;}
.ia-badge{display:inline-block;background:#f4b400;color:#333;font-size:.7rem;
  font-weight:700;padding:1px 6px;border-radius:10px;margin-left:6px;vertical-align:middle;}
.no-drx{text-align:center;padding:30px;color:#888;font-size:.88rem;}

/* ---- PANEL NO UBICADAS ---- */
#unlocatedPanel{position:absolute;bottom:10px;left:10px;z-index:1100;
  max-width:320px;max-height:200px;overflow-y:auto;background:#fff;border-radius:10px;
  padding:10px 12px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:.78rem;display:none;}
#unlocatedPanel.show{display:block;}
#unlocatedPanel h4{margin:0 0 6px;color:#a4161a;font-size:.85rem;}
#unlocatedPanel ul{margin:0;padding-left:16px;}
#loadingBar{position:absolute;bottom:0;left:0;right:0;z-index:1300;
  background:#1d3557;color:#fff;font-size:.78rem;padding:6px 12px;display:none;}

/* popup analyses */
.popup-analyses{display:flex;flex-direction:column;gap:3px;margin-top:8px;}
.analysis-no{font-size:.78rem;color:#c0392b;font-weight:600;padding:3px 6px;
  background:#fdecea;border-radius:4px;}
.desc-section{margin-bottom:16px;}
.desc-section h4{margin:0 0 8px;font-size:.9rem;color:#1d3557;border-bottom:1px solid #e0e0e0;padding-bottom:4px;}

/* ---- PAGINA DRX Y GEOQUIMICA ---- */
#page-geochem{flex-direction:row;overflow:hidden;}
/* tarjeta DRX+geo por muestra */
.drx-geo-card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;
  padding:16px;margin-bottom:18px;}
.drx-geo-card-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.drx-geo-code{font-size:1rem;font-weight:700;color:#1d3557;}
.drx-geo-tipo{font-size:.78rem;color:#888;background:#f0f4f8;padding:2px 8px;border-radius:12px;}
.drx-geo-body{display:flex;gap:16px;flex-wrap:wrap;}
.drx-geo-img{flex:0 0 220px;max-width:220px;}
.drx-geo-img img{width:100%;border-radius:6px;cursor:pointer;}
.drx-geo-img-placeholder{width:100%;height:160px;background:#f5f5f5;border:1px dashed #ccc;
  border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:.75rem;color:#aaa;text-align:center;}
.drx-geo-info{flex:1;min-width:200px;}
.drx-geo-popup-btn{background:#1d3557;color:#fff;border:none;border-radius:6px;
  padding:6px 12px;cursor:pointer;font-size:.78rem;font-weight:600;margin-bottom:10px;}
.drx-geo-popup-btn:hover{background:#264653;}
.geo-table-visual{width:100%;border-collapse:collapse;font-size:.78rem;}
.geo-table-visual th{background:#1d3557;color:#fff;padding:5px 8px;text-align:left;}
.geo-table-visual td{padding:4px 8px;border-bottom:1px solid #f0f0f0;}
.geo-table-visual tr:nth-child(even) td{background:#f7f9fc;}
.geo-bar-cell{display:flex;align-items:center;gap:6px;}
.geo-bar{height:10px;background:#e63946;border-radius:3px;min-width:2px;}
/* popup mineral info */
.mineral-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9000;
  display:flex;align-items:center;justify-content:center;}
.mineral-popup{background:#fff;border-radius:10px;padding:20px;max-width:480px;width:90%;
  max-height:80vh;overflow-y:auto;position:relative;}
.mineral-popup h3{margin:0 0 12px;color:#1d3557;}
.mineral-popup-close{position:absolute;top:10px;right:12px;background:none;border:none;
  font-size:1.2rem;cursor:pointer;color:#555;}

/* ---- PAGINA LAMINAS DELGADAS ---- */
#page-laminas{overflow-y:auto;padding:20px;}
.lam-page-sample{background:#fff;border:1px solid #ddd;border-radius:10px;
  margin-bottom:24px;overflow:hidden;}
.lam-page-header{background:#1d3557;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:12px;}
.lam-page-code{font-size:1rem;font-weight:700;}
.lam-page-tipo{font-size:.78rem;opacity:.8;}
.lam-page-body{padding:16px;}
.lam-desc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px;}
.lam-desc-box{background:#f7f9fc;border:1px solid #e0e0e0;border-radius:6px;padding:10px;}
.lam-desc-box label{font-size:.72rem;font-weight:700;color:#1d3557;text-transform:uppercase;
  display:block;margin-bottom:4px;}
.lam-desc-box p{margin:0;font-size:.8rem;color:#555;min-height:40px;}
.lam-pair-grid{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;}
.lam-pair-item{flex:1;min-width:200px;max-width:320px;}
.lam-pair-item img{width:100%;border-radius:6px;cursor:pointer;}
.lam-pair-label{font-size:.75rem;font-weight:600;color:#444;margin-top:4px;text-align:center;}
.lam-pair-coords{font-size:.72rem;color:#888;text-align:center;}
.lam-pair-title{font-size:.83rem;font-weight:700;color:#264653;margin:10px 0 6px;
  border-bottom:1px solid #eee;padding-bottom:4px;}
#gc-sidebar{width:260px;min-width:180px;background:#f7f9fc;border-right:1px solid #ddd;
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;}
#gc-sidebar-header{padding:12px;background:#1d3557;color:#fff;font-weight:700;
  font-size:.88rem;flex-shrink:0;}
#gc-sidebar-filters{padding:10px;flex-shrink:0;border-bottom:1px solid #ddd;}
#gc-sidebar-filters select,#gc-sidebar-filters input{
  width:100%;padding:5px 7px;border:1px solid #ccc;border-radius:5px;
  font-size:.8rem;margin-top:4px;}
#gc-sample-list{flex:1;overflow-y:auto;padding:4px 0;}
.gc-sample-item{padding:8px 12px;cursor:pointer;border-bottom:1px solid #eee;
  font-size:.8rem;transition:background .15s;}
.gc-sample-item:hover{background:#e8f0fe;}
.gc-sample-item.selected{background:#d0e4ff;font-weight:600;}
.gc-sample-item .gc-code{font-weight:700;color:#1d3557;}
.gc-sample-item .gc-tipo{font-size:.72rem;color:#888;}
#gc-main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#gc-rock-tabs{display:flex;background:#fff;border-bottom:2px solid #e0e0e0;
  flex-shrink:0;padding:0 12px;}
.gc-rock-tab{padding:10px 20px;border:none;background:none;cursor:pointer;
  font-size:.84rem;font-weight:600;color:#666;border-bottom:3px solid transparent;
  margin-bottom:-2px;transition:all .2s;}
.gc-rock-tab.active{color:#1d3557;border-bottom-color:#1d3557;}
.gc-rock-tab:hover:not(.active){background:#f0f0f0;}
#gc-content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-wrap:wrap;gap:14px;}
.gc-diagram-card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;
  overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.08);}
.gc-diagram-card img{width:100%;display:block;}
.gc-diagram-title{padding:6px 10px;font-size:.78rem;font-weight:600;color:#555;
  background:#f8f8f8;border-top:1px solid #eee;}
.gc-no-data{padding:40px;text-align:center;color:#888;font-size:.9rem;width:100%;}
#gc-selected-card{position:fixed;bottom:16px;right:16px;z-index:1200;
  background:#fff;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.25);
  padding:14px;max-width:340px;font-size:.8rem;display:none;}
#gc-selected-card.show{display:block;}
#gc-selected-card .gc-card-close{float:right;cursor:pointer;color:#888;font-size:1rem;}
#gc-selected-card h4{margin:0 0 8px;font-size:.88rem;color:#1d3557;}
.gc-values-table{width:100%;border-collapse:collapse;margin-top:6px;}
.gc-values-table td{padding:3px 6px;border-bottom:1px solid #f0f0f0;font-size:.77rem;}
.gc-values-table td:first-child{font-weight:600;color:#444;width:50%;}
.btn-ver-ficha{margin-top:8px;width:100%;padding:7px;background:#1d3557;color:#fff;
  border:none;border-radius:7px;cursor:pointer;font-weight:600;font-size:.82rem;}
.btn-ver-ficha:hover{background:#264653;}

@media(max-width:700px){
  #gc-sidebar{width:200px;}
  #mainNav h1{display:none;}
  .nav-tab{padding:14px 12px;font-size:.78rem;}
  #modal{width:98vw;max-height:96vh;}
  .lamina-pair{flex-direction:column;}
}
</style>
</head>
<body>

<!-- NAVEGACION PRINCIPAL -->
<nav id="mainNav">
  <h1>Muestras Geologicas — Petrografia / XRD UNINORTE</h1>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('map')">🗺 Mapa</button>
    <button class="nav-tab" onclick="showPage('geochem')">🔬 DRX y geoquímica</button>
    <button class="nav-tab" onclick="showPage('laminas')">🪨 Láminas delgadas</button>
  </div>
  <div id="counter">Cargando...</div>
</nav>

<!-- PAGINA: MAPA -->
<div id="page-map" class="page active">
  <button id="toggleFilters">&#9776; Filtros</button>
  <div id="filterPanel">
    <h3>Filtros</h3>
    <label for="searchCode">Buscar por UNINORTE CODE</label>
    <input type="text" id="searchCode" placeholder="Ej: NYB05">
    <label for="fPais">Pais</label>
    <select id="fPais"><option value="">Todos</option></select>
    <label for="fTipo">Tipo de roca</label>
    <select id="fTipo"><option value="">Todos</option></select>
    <label for="fAutor">Autor</label>
    <select id="fAutor"><option value="">Todos</option></select>
    <label for="fSpp">Especie (spp)</label>
    <select id="fSpp"><option value="">Todas</option></select>
    <div class="chk-row"><input type="checkbox" id="fDRX"><label for="fDRX">Solo con analisis DRX</label></div>
    <div class="chk-row"><input type="checkbox" id="fGeo"><label for="fGeo">Solo con analisis Geoquimico</label></div>
    <div class="chk-row"><input type="checkbox" id="fPetro"><label for="fPetro">Solo analisis petrografico</label></div>
    <button id="resetBtn">Limpiar filtros</button>
  </div>
  <div id="unlocatedPanel"></div>
  <div id="loadingBar"></div>
  <div id="map"></div>
</div>

<!-- PAGINA: DRX Y GEOQUIMICA -->
<div id="page-geochem" class="page">
  <div id="gc-sidebar">
    <div id="gc-sidebar-header">Muestras</div>
    <div id="gc-sidebar-filters">
      <select id="gc-filter-tipo">
        <option value="">Todos los tipos</option>
        <option value="IGNEA">Ígnea</option>
        <option value="SEDIMENTARIA">Sedimentaria</option>
        <option value="METAMORFICA">Metamórfica</option>
      </select>
    </div>
    <div id="gc-sample-list"></div>
  </div>
  <div id="gc-main">
    <div id="gc-content"></div>
  </div>
</div>

<!-- PAGINA: LAMINAS DELGADAS -->
<div id="page-laminas" class="page">
  <div id="lam-page-content"></div>
</div>

<!-- MODAL FICHA COMPLETA -->
<div id="modalOverlay">
  <div id="modal">
    <div id="modalHeader">
      <div>
        <div id="modalTitle">—</div>
        <div id="modalSubtitle">—</div>
      </div>
      <button id="closeModal">&#x2715;</button>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="tabDesc">📋 Descripción</button>
      <button class="tab-btn" data-tab="tabMuestra">📷 Fotos muestra macroscópica</button>
      <button class="tab-btn" data-tab="tabLaminas">🔬 Láminas delgadas</button>
      <button class="tab-btn" data-tab="tabDRX">📊 Análisis DRX EVA</button>
    </div>
    <div id="tabDesc" class="tab-content active">
      <div id="descBody"></div>
    </div>
    <div id="tabMuestra" class="tab-content">
      <div class="gallery">
        <img id="galleryImg" src="" alt="Foto muestra">
        <button class="gallery-nav" id="galleryPrev">&#8249;</button>
        <button class="gallery-nav" id="galleryNext">&#8250;</button>
      </div>
      <div class="gallery-counter" id="galleryCounter"></div>
      <div class="gallery-thumbs" id="galleryThumbs"></div>
    </div>
    <div id="tabLaminas" class="tab-content">
      <div id="laminasBody"></div>
    </div>

const DRX_DATA    = {"NYB04": {"cod_ids": ["COD 9013321", "COD 9011422", "COD 9005275", "COD 9003854", "COD 9013530", "COD 9000791"], "minerales": ["Quartz", "Oligoclase", "Epistilbite", "Pigeonite", "Magnetite", "Diopside"], "formulas": ["O2Si", "Al1.179Ca0.179Na0.821O8Si2.821", "Al0.768Ca0.333H2.38K0.024Na0.038O8Si2.232", "Al0.016Ca0.191Fe0.848Mg0.919Mn0.029Na0.003O6Si1.984Ti0.01", "Fe2.904O4Ti0.096", "Ca0.87Mg0.94Mn0.19O6Si2"], "descripcion": "Muestra recolectada en Cerro Pelado, Panama (Latitud: 9.00425, Longitud: -80.55319) por A. Bedoya en enero de 2025. Clasificada preliminarmente como roca ignea de tipo andesita. Esta muestra no cuenta con analisis geoquimico de roca total disponible. El analisis mineralogico por difraccion de rayos x (DRX) identifica de manera cuantitativa el ensamble compuesto por Quartz, Oligoclase, Epistilbite, Pigeonite, Magnetite y Diopside.", "interpretacion": "La paragénesis mineralógica por DRX es congruente con una litología ígnea intermedia de tipo andesita. Ante la ausencia de datos litoquímicos, la caracterización se restringe a sus fases cristalinas. El ensamble magmático primario está dominado por plagioclasa intermedia (Oligoclase), coexistiendo con clinopiroxeno cálcico (Diopside), piroxeno pobre en calcio de rápido enfriamiento (Pigeonite) y magnetita titanífera accesoria (Magnetite). Superpuesto a este evento primario, se reconoce una alteración hidrotermal de baja temperatura (facies de zeolitas) evidenciada por la neoformación de Epistilbite y cuarzo secundario libre. Esta asociación sugiere un metasomatismo hidrotermal distal y tardío, vinculable a los halos periféricos del arco magmático Oligocénico en el Distrito de Donoso / Petaquilla.", "nota": ""}, "NYB05": {"cod_ids": ["COD 9010145", "COD 9009663", "COD 9004954", "COD 9000766", "COD 9005318"], "minerales": ["Quartz", "Albite", "Diopside", "Penninite", "Leonhardite"], "formulas": ["O2Si", "Al1.02Ca0.02Na0.98O8Si2.98", "Ca0.7Mg1.3O6Si2", "Al1.64Fe0.3H7.86Mg4.9O17.98Si3.16", "Al4.072Ca1.276H4.534K0.795Na0.62O31Si7.928"], "descripcion": "Roca ignea de composicion intermedia-mafica con un contenido de SiO2 de 52.43%, Al2O3 de 15.13%, Fe2O3(T) de 9.78%, CaO de 4.57%, MgO de 3.99%, Na2O de 2.98% y K2O de 1.80%. Registra una perdida por calcinacion (LOI) de 7.65%. El analisis por difraccion de rayos x (DRX) identifica de manera cuantitativa la presencia de Albita, Diopsido, Penninita, Leonhardita y Cuarzo", "interpretacion": "Andesita basaltica hidrotermalizada (Distrito Donoso/Petaquilla). Quimicamente clasificada como una roca intermedia-mafica con base en su rango de silice (SiO2: 52.43%). La mineralogia primaria original (magmatica) esta representada por el ensamble de Albita y remanentes de Diopsido, fases que controlan los valores basales de aluminio, sodio y parte del calcio y magnesio. La roca experimento un marcado proceso de alteracion hidrotermal de tipo propilitico-zeolitico tardio. Esto se evidencia geoquimicamente por la elevada perdida por calcinacion (LOI: 7.65%), la cual esta directamente vinculada a la cristalizacion de minerales hidratados secundarios detectados por DRX: Penninita (clorita magnesica que aloja el Fe2O3 y el MgO liberados en la descomposicion de los piroxenos) y Leonhardita (zeolita de calcio que fija el K2O de 1.80% mediante fluidos tardios de baja temperatura). La presencia de Cuarzo libre confirma un metasomatismo de silice menor. Este ensamble mineralogico y quimico es caracteristico de las zonas perifericas o halos de enfriamiento dentro de sistemas de porfido cuprifero.", "nota": ""}, "NYB06": {"cod_ids": ["COD 9000642", "COD 9005682", "COD 1011097", "COD 9011200", "COD 9004245"], "minerales": ["Analcime", "Diopside", "Quartz low", "Bytownite", "Sanidine"], "formulas": ["Al1.88H4Na1.87O14Si4.12", "B0.024Ca0.844Mg0.922Na0.128O6Si1.888Ti0.188", "O2Si", "Al0.92Ca0.43Na0.07O4Si1.08", "AlKO8Si3"], "descripcion": "Muestra NYB06. Clasificada preliminarmente como roca ignea de tipo basalto, localizada en Rio Diego 2, Panama (Latitud: 9.11972, Longitud: -80.39265), recolectada por A. Bedoya en enero de 2027. Esta muestra no cuenta con analisis geoquimico de roca total disponible. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Analcime, Diopside, Quartz low, Bytownite y Sanidine.", "interpretacion": "La parogenesis mineralogica determinada por DRX es congruente con una litologia ignea mafica de tipo basalto. En ausencia de datos litoquimicos, la caracterizacion se restringe a sus fases cristalinas. El ensamble magmatico primario esta dominado por plagioclasa calcica (Bytownite) coexistiendo con clinopiroxeno titanifero (Diopside) y feldespato potasico de alta temperatura (Sanidine). Superpuesto a este evento magmatico, se reconoce una alteracion hidrotermal alcalina de baja temperatura evidenciada por la neoformacion de Analcime (zeolita de sodio) y Quartz low secundario. Esta asociacion sugiere una hidrolisis y reemplazo de los feldespatos primarios por fluidos hidrotermales distales enriquecidos en sodio, vinculable a los estadios tardios o de baja temperatura en la periferia del sistema magmatico del Distrito de Donoso / Petaquilla.", "nota": "El análisis por DRX en Bruker EVA confirma la presencia de analcima, diópsido, cuarzo bajo, bytownita y sanidina. Las opciones automáticas del software (innelita, edgrewita, kampfita y litochlebita) quedan descartadas por incompatibilidad con la muestra. Asimismo, el pico registrado en 2θ ≈ 5.9° se asigna directamente a una esméctita, mientras que la señal en 2θ ≈ 45.3° corresponde a reflexiones secundarias de los piroxenos y plagioclasas ya seleccionados."}, "NYB07": {"cod_ids": ["COD 9010146", "COD 9004191", "COD 9011423", "COD 9000743"], "minerales": ["Quartz", "Microcline", "Oligoclase", "Biotite"], "formulas": ["O2Si", "AlK0.95Na0.05O8Si3", "Al1.277Ca0.277Na0.723O8Si2.723", "Al1.208Fe1.3392KMg1.161O12Si2.792TiO0.276"], "descripcion": "Muestra NYB07 (WCSU-05545). Clasificada preliminarmente como roca ignea de tipo granito, localizada en Sipaliwini, Djumu, Suriname River, Suriname (Latitud: 4.015889, Longitud: -55.473333), recolectada por C.T. Philbrick (6203) el 27 de octubre de 2007. Registra un contenido geoquimico de SiO2 de 64.5%, Al2O3 de 16.34%, Fe2O3(T) de 1.81%, MnO de 0.05%, MgO de 0.43%, CaO de 1.32%, Na2O de 2.37% y K2O de 8.83%, con una perdida por calcinacion (LOI) de 2.52%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz, Microcline, Oligoclase y Biotite.", "interpretacion": "La parogenesis mineralogica determinada por DRX es congruente con una litologia ignea plutonica acida a intermedia, clasificada quimicamente como un granito potasico a granodiorita rica en feldespato alcalino debido al elevado contenido de K2O (8.83%) y moderado SiO2 (64.5%). El ensamble magmatico primario en equilibrio esta dominado por feldespato potasico (Microcline) y plagioclasa sodico-calcica intermedia (Oligoclase), que controlan los valores de aluminio y alcalis, junto con Quartz libre y una fase ferromagnesiana accesoria representada por Biotite titanifera (que aloja el Fe2O3 de 1.81%, el MgO de 0.43% y el TiO2 de 0.352%). La roca exhibe una perdida por calcinacion moderada (LOI: 2.52%), lo que sugiere procesos de alteracion hidrotermal post-magmatica incipiente o meteorizacion tropical de los feldespatos en el Escudo de Guayana, consistente estructuralmente con los complejos plutonicos paleoproterozoicos de la region de Sipaliwini.", "nota": ""}, "NYB08": {"cod_ids": ["COD 1011159", "COD 9000189", "COD 9011422", "COD 9000468"], "minerales": ["Quartz low", "Microcline", "Oligoclase", "Biotite"], "formulas": ["O2Si", "Al0.93KO8Si3.07", "Al1.179Ca0.179Na0.821O8Si2.821", "Al1.999K0.5Mg2.001O12Si3"], "descripcion": "Muestra NYB08. Clasificada preliminarmente como roca ignea de tipo granito, localizada en Sipaliwini, Buvuhulo, Suriname River, Suriname (Latitud: 4.024167, Longitud: -55.479444), recolectada por C.T. Philbrick (6203) el 27 de octubre de 2007. Registra un contenido geoquimico de SiO2 de 64.66%, Al2O3 de 16.71%, Fe2O3(T) de 1.84%, MnO de 0.11%, MgO de 0.43%, CaO de 1.10%, Na2O de 2.26% y K2O de 9.51%, con una perdida por calcinacion (LOI) de 1.88%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz low, Microcline, Oligoclase y Biotite.", "interpretacion": "La parogenesis mineralogica determinada por DRX es congruente con una litologia ignea plutonica acida a intermedia, caracterizada geoquimicamente como un granito hiperpotasico dado el conspicuo contenido de K2O (9.51%) y un valor moderado de SiO2 (64.66%). El ensamble magmatico primario en condiciones de equilibrio estable esta dominado por feldespato potasico (Microcline) y plagioclasa sodico-calcica (Oligoclase), que controlan el balance de aluminio y alcalis, en coexistencia con Quartz low y una fase ferromagnesiana ferrosa secundaria-accesoria tipificada por Biotite (la cual secuestra el Fe2O3 de 1.84% y el MgO de 0.43%). La muestra presenta una baja perdida por calcinacion (LOI: 1.88%), consistente con una preservacion cristalina optima y procesos de alteracion hidrotermal o meteórica incipientes. Este sistema plutonico se asocia geneticamente a los complejos granitoides paleoproterozoicos del Escudo de Guayana en la region de Sipaliwini.", "nota": ""}, "NYB10": {"cod_ids": ["COD 5000035", "COD 9011422", "COD 9002303", "COD 9004191", "COD 9001926", "COD 9002180"], "minerales": ["Quartz", "Oligoclase", "Biotite", "Microcline", "Actinolite", "Epidote"], "formulas": ["O2Si", "Al1.179Ca0.179Na0.821O8Si2.821", "Al1.78Cl0.04F0.16Fe1.48H1.56K0.98Mg0.7Na0.02O11.8Si2.72Ti0.16", "AlK0.95Na0.05O8Si3", "Al0.194Ca1.922Fe1.538H1.92K0.01Mg3.364Mn0.052Na0.052O24Si7.888Ti0.002", "Al2.32Ca2Fe0.68O13Si3"], "descripcion": "Muestra NYB10 (WCSU-05489). Clasificada preliminarmente como roca metamorfica de tipo esquisto, localizada en Sipaliwini, Lucie River, Suriname (Latitud: 3.564361, Longitud: -57.482889), recolectada por C.T. Philbrick (6183) el 21 de octubre de 2007. Registra un contenido geoquimico de SiO2 de 64.07%, Al2O3 de 14.82%, Fe2O3(T) de 4.79%, MnO de 0.12%, MgO de 2.56%, CaO de 3.32%, Na2O de 3.39% y K2O de 4.26%, con una perdida por calcinacion (LOI) de 1.46%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz, Oligoclase, Biotite, Microcline, Actinolite y Epidote.", "interpretacion": "La parogenesis mineralogica determinada por DRX es congruente con una litologia metamorfica de grado medio, clasificada quimicamente como un meta-granitoide o un esquisto cuarzo-feldespatico de composicion intermedia a acida (SiO2: 64.07%). La presencia del ensamble Quartz, Oligoclase y Microcline define la matriz tectosilicatada que controla la concentracion de Al2O3 (14.82%) y alcalis. Los valores elevados de Fe2O3(T) (4.79%), MgO (2.56%) y CaO (3.32%) estan directamente asociados a la cristalizacion de minerales ferromagnesianos y calcicos diagnosticos del metamorfismo regional: Biotite (mica cloritizada/titanifera), Actinolite (anfibol calcico) y Epidote (sorosilicato de calcio y hierro). Esta asociacion mineral es un indicador clasico de la facies de esquistos verdes de alta temperatura a transicion con la facies de anfibolita, caracteristica del retrabajamiento tectono-metamorfico paleoproterozoico que afecto al basamento del Escudo de Guayana en la cuenca del Rio Lucie.", "nota": ""}, "NYB12": {"cod_ids": ["COD 9013321", "COD 9011422", "COD 9004191", "COD 9002305"], "minerales": ["Quartz", "Oligoclase", "Microcline", "Biotite"], "formulas": ["O2Si", "Al1.179Ca0.179Na0.821O8Si2.821", "AlK0.95Na0.05O8Si3", "Al1.84Ba0.02Ca0.02Fe1.54H1.6K0.96Mg0.7Na0.03O12Si2.64Ti0.2"], "descripcion": "Muestra NYB12. Clasificada preliminarmente como roca metamorfica de tipo gneis, localizada en Sipaliwini, Drietabbetie, Tapanahani River, Suriname (Latitud: 4.009444, Longitud: -54.81), recolectada por C.T. Philbrick (6237) el 1 de noviembre de 2007. Registra un contenido geoquimico de SiO2 de 71.06%, Al2O3 de 12.43%, Fe2O3(T) de 3.18%, MnO de 0.07%, MgO de 1.16%, CaO de 0.95%, Na2O de 2.34% y K2O de 5.24%, con una perdida por calcinacion (LOI) de 1.92%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz, Oligoclase, Microcline y Biotite.", "interpretacion": "La parogenesis mineralogica por DRX es totalmente consistente con una litologia metamorfica de alto grado derivada de un protolito félsico (ortogneis). Geoquimicamente, el caracter acido (SiO2: 71.06%) y el fuerte dominio potasico (K2O: 5.24%) se reflejan en la abundante cristalizacion de Microcline, la cual coexiste con Quartz y plagioclasa sodica (Oligoclase), definiendo las bandas leucocraticas de la roca. El contenido de Fe2O3(T) (3.18%) y MgO (1.16%) esta controlado por la segregacion de micas moficas en bandas melanocraticas, tipificadas por Biotite, cuya formula empirica revela ademas la incorporacion de titanio (concordante con el TiO2 de 0.431%) y bario (Ba: 1654 ppm). La baja perdida por calcinacion (LOI: 1.92%) es tipica de la deshidratacion por metamorfismo regional profundo en la facies de anfibolita superior, vinculable a los eventos orogenicos del Paleoproterozoico (Ciclo Trans-Amazoniano) en el Escudo de Guayana.", "nota": ""}, "NYB13": {"cod_ids": ["COD 9009666", "COD 9000785", "COD 9000220", "COD 9005527", "COD 9009233"], "minerales": ["Quartz", "Albite", "Epidote", "Phengite-2M1", "Chamosite"], "formulas": ["O2Si", "Al1.005Na0.986O8Si2.995", "Al2.17Ca2Fe0.81HO13Si3", "Al1.97Fe0.24H2K0.99Mg0.33Na0.02O12Si3.45Ti0.04", "Al1.2Fe2.482H10Mg2.518O18Si3.8"], "descripcion": "Muestra NYB13. Clasificada preliminarmente como roca ignea de tipo granodiorita, localizada en Sipaliwini, Drietabbetie, Tapanahani River, Suriname (Latitud: 3.564889, Longitud: -57.484361), recolectada por C.T. Philbrick (6250) el 2 de noviembre de 2007. Esta muestra no cuenta con analisis geoquimico de roca total disponible. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz, Albite, Epidote, Phengite-2M1 y Chamosite.", "interpretacion": "La parogenesis mineralogica determinada por DRX denota una profunda modificacion metasomatica sobre una litologia plutonica clasificada preliminarmente como granodiorita. En ausencia de datos litoquimicos de roca total, la interpretacion se restringe al analisis de sus fases cristalinas secundarias dominantemente desarrolladas. El ensamble magmatico primario original se encuentra severamente reemplazado, preservandose unicamente Quartz y plagioclasa sodica pura (Albite), producto de un proceso de albitizacion de feldespatos calcicos. La descomposicion de las fases ferro-magnesianas y de la plagioclasa primaria dio lugar a una intensa alteracion hidrotermal en facies de esquistos verdes (alteracion propilitica-sericitica), evidenciada por la neoformacion de Epidote, Phengite-2M1 (mica potasica diodraedrica rica en silice y magnesio) y Chamosite (clorita rica en hierro). Esta signatura mineralogica secundaria es indicativa de la circulacion de fluidos hidrotermales de temperatura moderada a baja, vinculable a zonas de cizalla o halos de alteracion tardios que afectaron al basamento paleoproterozoico del Escudo de Guayana en la cuenca del Rio Tapanahani.", "nota": ""}, "NYB18": {"cod_ids": ["COD 5000035", "COD 9002200", "COD 9004191", "COD 9002305"], "minerales": ["Quartz", "Albite", "Microcline", "Biotite"], "formulas": ["O2Si", "AlNaO8Si3", "AlK0.95Na0.05O8Si3", "Al1.84Ba0.02Ca0.02Fe1.54H1.6K0.96Mg0.7Na0.03O12Si2.64Ti0.2"], "descripcion": "Muestra NYB18 (WCSU-05621). Clasificada preliminarmente como roca ignea de tipo Granito/Riolita, localizada en el Rio Tocomita, Estado Bolivar, Venezuela, recolectada por C.T. Philbrick (5808) el 14 de enero de 2007 (asociada a muestras botanicas de Apinagia riedelii). Esta muestra no cuenta con coordenadas geograficas exactas de latitud y longitud. Registra un contenido geoquimico de SiO2 de 73.25%, Al2O3 de 13.88%, Fe2O3(T) de 2.39%, MnO de 0.02%, MgO de 0.33%, CaO de 1.29%, Na2O de 3.65% y K2O de 3.65%, con una perdida por calcinacion (LOI) de 0.72%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz, Albite, Microcline y Biotite.", "interpretacion": "La parogenesis mineralogica determinada por DRX confirma de manera precisa una litologia plutonica félsica o su equivalente volcanico, consistente con un granito calcoalcalino de alta silice (SiO2: 73.25%). El armazon tectosilicatado primario esta constituido por Quartz libre, Microcline y Albite, lo cual se corrobora perfectamente con la simetria geoquimica de los alcalis (Na2O: 3.65% y K2O: 3.65%) y el aporte de Al2O3 (13.88%). Los deprimidos contenidos de Fe2O3(T) (2.39%), MgO (0.33%) y TiO2 (0.223%) estan regulados por la escasa fraccion ferromagnesiana accesoria de Biotite, cuya formula estructural refleja la fijacion de trazas de titanio y bario (Ba: 1031 ppm). El valor minimo de LOI (0.72%) ratifica la ausencia de fases arcillosas o carbonatadas secundarias. Esta firma mineralogica-quimica es caracteristica de los granitoides post-orogenicos cratonicos del Paleoproterozoico que conforman las suites plutonicas del Escudo de Guayana en la region de Bolivar.", "nota": ""}, "NYB19": {"cod_ids": ["COD 5000035", "COD 9005527"], "minerales": ["Quartz", "Phengite-2M1"], "formulas": ["O2Si", "Al1.97Fe0.24H2K0.99Mg0.33Na0.02O12Si3.45Ti0.04"], "descripcion": "Muestra NYB19 (WCSU-05495). Clasificada preliminarmente como roca sedimentaria de tipo cuarzoarenita, localizada en el Rio Paragua, Estado Bolivar, Venezuela (Latitud: 6.320278, Longitud: -63.622778), recolectada por C.T. Philbrick (6047) el 14 de enero de 2007 (asociada a muestras botanicas de Oserya perpusilla). Registra un contenido geoquimico de SiO2 de 89.58%, Al2O3 de 3.53%, Fe2O3(T) de 3.36%, MnO de 0.02%, MgO de 0.23%, CaO de 0.35%, Na2O de 0.12% y K2O de 1.11%, con una perdida por calcinacion (LOI) de 1.61%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz y Phengite-2M1.", "interpretacion": "La parogenesis mineralogica determinada por DRX es altamente consistente con una litologia sedimentaria detritica madura, clasificada como una cuarzoarenita debido al marcado predominio de SiO2 (89.58%). El armazon principal de la roca esta constituido por granos de Quartz clastico. La fraccion de matriz arcillosa o cemento silicatado secundario esta dominada por Phengite-2M1, una mica potasica rica en silice y magnesio que controla los contenidos de Al2O3 (3.53%) y K2O (1.11%). La presencia de hierro relativamente elevado (Fe2O3(T): 3.36%) no se refleja en fases oxidadas discretas en el DRX, sugiriendo que se aloja estructuralmente dentro de la formula de la fengita o como tintes de hematita amorfa/matriz criptocristalina. El valor moderado de LOI (1.61%) responde al agua estructural (H2) de esta fase micacea. Estratigraficamente, esta signatura quimico-mineralogica puramente silicea es representativa de las coberturas sedimentarias proterozoicas cratonicas que forman los tepuyes de la Formacion Roraima o sus depositos aluviales erosionados en la cuenca del Rio Paragua, Escudo de Guayana.", "nota": ""}, "NYB21": {"cod_ids": ["COD 5000035", "COD 9004191", "COD 9002196", "COD 901583"], "minerales": ["Quartz", "Microcline", "Albite", "Biotite"], "formulas": ["O2Si", "AlK0.95Na0.05O8Si3", "AlNaO8Si3", "Al1.216Fe1.215K0.946Mg1.545Mn0.018Na0.032O12Si2.784Ti0.225"], "descripcion": "Muestra NYB21 (WCSU-05590). Clasificada preliminarmente como roca metamorfica de tipo gneis, localizada en el Rio Ventuari, Estado Amazonas, Venezuela (Latitud: 4.069111, Longitud: -66.908056), recolectada por C.T. Philbrick (6323) (asociada a muestras botanicas de Lophogyne sp.). Registra un contenido geoquimico de SiO2 de 65.09%, Al2O3 de 15.22%, Fe2O3(T) de 4.17%, MnO de 0.16%, MgO de 0.77%, CaO de 1.72%, Na2O de 2.28% y K2O de 6.45%, con una perdida por calcinacion (LOI) de 2.49%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz, Microcline, Albite y Biotite.", "interpretacion": "La parogenesis mineralogica determinada por DRX es consistente con una litologia metamorfica de alto grado derivada de un protolito de composicion intermedia-felsica (ortogneis). Geoquimicamente, el caracter siliceo moderado (SiO2: 65.09%) y el marcado dominio potasico (K2O: 6.45%) se reflejan en la fuerte cristalizacion de Microcline, la cual coexiste con Albite y Quartz libre para estructurar las bandas leucocraticas de la roca. Los contenidos de Fe2O3(T) (4.17%) y MgO (0.77%) estan controlados por la segregacion de micas moficas en bandas melanocraticas compuestas por Biotite; la formula empirica de esta fase confirma ademas la fijacion de titanio (coherente con el TiO2 de 0.564%) y manganeso (MnO: 0.16%). La perdida por calcinacion (LOI: 2.49%) sugiere una rehidratacion o alteracion retrograda incipiente. Este ensamble tectonotermico es representativo del basamento paleoproterozoico regenerado o de los complejos plutonico-metamorficos asociados a la Provincia Geocronologica de Rio Negro-Juruena dentro del Escudo de Guayana en la cuenca del Rio Ventuari.", "nota": ""}, "NYB22": {"cod_ids": ["COD 1011097", "COD 9004191", "COD 9002197", "COD 9009233"], "minerales": ["Quartz low", "Microcline", "Albite", "Chamosite"], "formulas": ["O2Si", "AlK0.95Na0.05O8Si3", "AlNaO8Si3", "Al1.2Fe2.482H10Mg2.518O18Si3.8"], "descripcion": "Muestra NYB22 (WCSU-05629). No cuenta con clasificacion preliminar de campo ni analisis geoquimico de roca total disponible. Localizada en el Rio Ventuari, Estado Bolivar, Venezuela, recolectada por C.T. Philbrick (6306) el 5 de marzo de 2009 (asociada a muestras botanicas de Lophogyne penicillata). Esta muestra no cuenta con coordenadas geograficas exactas de latitud y longitud. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz low, Microcline, Albite y Chamosite.", "interpretacion": "El ensamble mineralogico determinado por DRX denota una litologia original plutonica felsica (de afinidad granitica) o su equivalente metamorfico de alto grado (ortogneis), que ha sido afectada por un evento hidrotermal superpuesto de baja temperatura. La parogenesis tectosilicatada primaria esta regida por la coexistencia de feldespato potasico (Microcline) y plagioclasa sodica pura (Albite) acompañados de Quartz low libre. La fraccion mafica primaria original se encuentra completamente reemplazada por la neoformacion de Chamosite, una clorita rica en hierro y magnesio que evidencia un proceso de alteracion hidrotermal retrograda en facies de esquistos verdes (alteracion propilitica). Tectono-estratigraficamente, esta signatura cristalina es consistente con los complejos granitoides y sustratos deformados paleoproterozoicos del Escudo de Guayana que afloran en las transiciones de las cuencas fluviales de la region de Bolivar y Amazonas.", "nota": ""}, "NYB23": {"cod_ids": ["COD 1011097", "COD 9004191", "COD 9002196", "COD 9004124"], "minerales": ["Quartz low", "Microcline", "Albite", "Ferritaramite"], "formulas": ["O2Si", "AlK0.95Na0.05O8Si3", "AlNaO8Si3", "Al1.84Ca1.178Fe3.736H2K0.494Mg0.885Mn0.185Na1.582O24Si6.2Ti0.186"], "descripcion": "Muestra NYB23 (WCSU-05558). Clasificada preliminarmente como roca ignea de tipo granito, localizada en el Estado Amazonas, Venezuela, recolectada por C.T. Philbrick (6312) el 6 de marzo de 2009 (asociada a muestras botanicas de Lophogyne aeruginosa). Esta muestra no cuenta con coordenadas geograficas exactas de latitud y longitud. Registra un contenido geoquimico de SiO2 de 73.85%, Al2O3 de 12.06%, Fe2O3(T) de 2.95%, MnO de 0.04%, MgO de 0.23%, CaO de 0.81%, Na2O de 2.43% y K2O de 5.83%, con una perdida por calcinacion (LOI) de 1.22%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz low, Microcline, Albite y Ferritaramite.", "interpretacion": "La parogenesis mineralogica determinada por DRX confirma una litologia ignea plutonica acida de caracteristicas subalcalinas, clasificada quimicamente como un granito potasico evolucionado dado su elevado contenido de SiO2 (73.85%) y K2O (5.83%). El armazon principal tectosilicatado esta regido por Quartz low secundario o libre, Microcline y Albite, que controlan el balance de aluminio y alcalis. Los valores de Fe2O3(T) (2.95%), CaO (0.81%) y TiO2 (0.538%) estan controlados por la presencia de una fase de anfibol sodico-calcico ferri-magnetico diagnostica, tipificada como Ferritaramite, cuya formula estructural compleja aloja de manera directa el hierro, titanio, manganeso y los cationes intersticiales de sodio y calcio. La baja perdida por calcinacion (LOI: 1.22%) refleja condiciones optimas de preservacion con nula alteracion hidrotermal profunda o meteorizacion. Tectono-estratigraficamente, esta signatura magmatica rica en alcalis y anfiboles especificos es representativa de los complejos granitoides alcalinos a subalcalinos de tipo A del Paleoproterozoico-Mesoproterozoico (como la Suite Intrusiva de Parguaza) que intruyen el basamento del Escudo de Guayana en el Estado Amazonas.", "nota": ""}, "NYB28": {"cod_ids": ["COD 9000747", "COD 9005629", "COD 9002205", "COD 9006427"], "minerales": ["Labradorite", "Pigeonite", "Titanite", "Enstatite"], "formulas": ["Al0.824Ca0.325Na0.175O4Si1.174", "Ca0.15Mg1.85O6Si2", "AlCaFO4Si", "Fe0.41Mg0.59O3Si"], "descripcion": "Muestra NYB28 (WCSU-05565). Clasificada preliminarmente como roca ignea de tipo porfido, localizada en el Rio Cucaracho, Alajuela, Costa Rica, recolectada por C.T. Philbrick (5907) el 14 de marzo de 2006 (asociada a muestras botanicas de Marathrum foeniculaceum). Esta muestra no cuenta con coordenadas geograficas exactas de latitud y longitud. Registra un contenido geoquimico de SiO2 de 55.92%, Al2O3 de 16.98%, Fe2O3(T) de 8.69%, MnO de 0.22%, MgO de 3.79%, CaO de 7.56%, Na2O de 2.80% y K2O de 1.50%, con una perdida por calcinacion (LOI) de 2.46%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Labradorite, Pigeonite, Titanite y Enstatite.", "interpretacion": "La parogenesis mineralogica determinada por DRX es totalmente consistente con una litologia ignea subvolcanica-extrusiva de composicion intermedia, clasificada quimicamente como una andesita con base en su contenido de silice (SiO2: 55.92%) y su afinidad calcoalcalina de medio a bajo potasio (K2O: 1.50%). El ensamble magmatico primario esta dominado por fenocristales y matriz de plagioclasa calcica (Labradorite), coexistiendo en equilibrio termodinamico con dos fases piroxenicas distintas: un ortopiroxeno (Enstatite) y un clinopiroxeno pobre en calcio (Pigeonite), asociacion que controla los contenidos de Fe2O3(T) (8.69%), CaO (7.56%) y MgO (3.79%). Como fase accesoria se desarrolla Titanite, mineral que fija de manera directa el TiO2 (0.744%) y parte del calcio libre. La moderada perdida por calcinacion (LOI: 2.46%) sugiere procesos de alteracion hidrotermal o meteórica de grado bajo, consistentes con el marco de deformacion del Arco Volcanico de Costa Rica en la provincia de Alajuela.", "nota": ""}, "NYB30": {"cod_ids": ["COD 9013321", "COD 9001030", "COD 9010738", "COD 9006347", "COD 9001921"], "minerales": ["Quartz", "Andesine", "Phlogopite", "Orthoclase", "Actinolite"], "formulas": ["O2Si", "Al0.735Ca0.24Na0.26O4Si1.265", "Fe0.752H1.405KMg2.248O12Si4", "AlKO8Si3", "Al0.138Ca1.774Fe0.594H1.976K0.01Mg4.43Mn0.02Na0.132O24Si7.952"], "descripcion": "Muestra NYB30 (WCSU-05676). Clasificada preliminarmente como roca metamorfica, localizada en Palmichal, Rio Negro, Costa Rica (Latitud: 9.837917, Longitud: -84.186861), recolectada por C.T. Philbrick (5957) el 22 de marzo de 2006 (asociada a muestras botanicas de Marathrum tenue). Registra un contenido geoquimico de SiO2 de 66.19%, Al2O3 de 14.28%, Fe2O3(T) de 5.14%, MnO de 0.04%, MgO de 2.2%, CaO de 6.27%, Na2O de 1.73% y K2O de 2.26%, con una perdida por calcinacion (LOI) de 1.91%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz, Andesine, Phlogopite, Orthoclase y Actinolite.", "interpretacion": "La parogenesis mineralogica determinada por DRX es congruente con una roca metamorfica de grado bajo a medio, clasificada quimicamente como un meta-granitoyde o meta-andesita basica de base intermedia (SiO2: 66.19%). La presencia del ensamble de feldespatos compuesto por Andesine y Orthoclase, coexistiendo con Quartz, define una matriz cuarzo-feldespatica que regula el balance de Al2O3 (14.28%) y alcalis. Los valores elevados de Fe2O3(T) (5.14%), MgO (2.20%) y CaO (6.27%) estan directamente vinculados a la neoformacion y estabilidad de fases ferromagnesianas diagnosticas de metamorfismo regional: Actinolite (anfibol calcico) y Phlogopite (mica biotitica rica en magnesio y potasio). Este ensamble es un indicador clasico de la facies de esquistos verdes de grado medio a alto, reflejando el retrabajamiento tectono-termico y la deformacion compresiva asociadas a los complejos metamorficos y basamentos alterados del sistema de arco de Costa Rica en la region de Palmichal.", "nota": ""}, "NYB32": {"cod_ids": ["COD 9009666", "COD 9011422", "COD 9002303", "COD 9004191"], "minerales": ["Quartz", "Oligoclase", "Biotite", "Microcline"], "formulas": ["O2Si", "Al1.179Ca0.179Na0.821O8Si2.821", "Al1.78Cl0.04F0.16Fe1.48H1.56K0.96Mg0.7Na0.02O11.8Si2.72Ti0.16", "AlK0.95Na0.05O8Si3"], "descripcion": "Muestra NYB32. Clasificada preliminarmente como roca metamorfica de tipo ortogneis, localizada en Bahia Jociate, Rio de Contas, Brasil (Latitud: 13.570556, Longitud: -41.609444), recolectada por Claudia Bove (2327) el 29 de junio de 2012 (asociada a muestras botanicas de Oserya perpusilla). Registra un contenido geoquimico de SiO2 de 65.96%, Al2O3 de 14.31%, Fe2O3(T) de 5.00%, MnO de 0.07%, MgO de 1.96%, CaO de 1.13%, Na2O de 2.77% y K2O de 5.13%, con una perdida por calcinacion (LOI) de 2.09%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz, Oligoclase, Biotite y Microcline.", "interpretacion": "La parogenesis mineralogica determinada por DRX es consistente con un ortogneis de composicion intermedia a acida, derivado de un protolito plutonico de afinidad granodioritica a granitica calcoalcalina con base en su contenido de silice (SiO2: 65.96%) y potasio dominante (K2O: 5.13%). El armazon tectosilicatado recristalizado constituyente de las bandas leucocraticas esta compuesto por Quartz, Microcline y plagioclasa sodica (Oligoclase), controlando la concentracion de Al2O3 (14.31%) y alcalis. La foliacion y las bandas melanocraticas estan definidas por la segregacion de Biotite, mineral ferromagnesiano que acomoda de forma directa el Fe2O3(T) (5.00%), el MgO (1.96%) y el TiO2 (0.763%). Se destaca un notable enriquecimiento de Zr (703 ppm) e Y (129 ppm), sugiriendo la preservacion de fases accesorias refractarias densas. La perdida por calcinacion (LOI: 2.09%) es coherente con micas hidratadas bajo metamorfismo regional en facies de anfibolita. Tectono-estratigraficamente, esta unidad pertenece al basamento arqueano-paleoproterozoico del Craton de Sao Francisco en el bloque Gavião o sistemas de colision asociados en el estado de Bahia.", "nota": ""}, "NYB36": {"cod_ids": ["COD 9009666", "COD 9000783", "COD 901952", "COD 9009233"], "minerales": ["Quartz", "Albite", "Muscovite-2M1", "Chamosite"], "formulas": ["O2Si", "Al1.005Na0.986O8Si2.995", "Al2.37F0.04Fe0.3H0.3K0.99Mn0.06Na0.01O11.96Si3.32", "Al1.2Fe2.482H10Mg2.518O18Si3.8"], "descripcion": "Muestra NYB36 (WCSU-04779). Clasificada preliminarmente como roca metamorfica de tipo esquisto, localizada en Palestina do Para County, Rio Araguaia, Estado de Para, Brasil (Latitud: -6.14578, Longitud: -48.35633), recolectada por C.P. Bove (2366) el 2 de julio de 2013 (asociada a muestras botanicas de Castelnavia fluitans). Registra un contenido geoquimico de SiO2 de 73.66%, Al2O3 de 11.49%, Fe2O3(T) de 3.58%, MnO de 0.04%, MgO de 1.26%, CaO de 0.68%, Na2O de 2.82% y K2O de 2.13%, con una perdida por calcinacion (LOI) de 2.20%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz, Albite, Muscovite-2M1 y Chamosite.", "interpretacion": "La parogenesis mineralogica determinada por DRX es congruente con una litologia metamorfica de bajo grado, clasificada quimicamente como un esquisto cuarzo-feldespatico o metapelita rica en silice dada la elevada concentracion de SiO2 (73.66%). El armazon cristalino principal de la roca esta regido por Quartz y plagioclasa sodica pura (Albite), fases que controlan el contenido de Na2O (2.82%). El plano de esquistosidad esta definido por la neoformacion de filosilicatos secundarios estables bajo metamorfismo regional: Muscovite-2M1 (mica potasica que fija el K2O de 2.13% y el Al2O3 de 11.49%) y Chamosite (clorita rica en hierro y magnesio que acomoda el Fe2O3(T) de 3.58% y el MgO de 1.26%). La moderada perdida por calcinacion (LOI: 2.20%) responde directamente al agua estructural de estas fases micaceas e hidratadas. Georregionalmente, esta firma litologica y estructural es caracteristica de las secuencias supracrustales metasedimentarias plegadas pertenecientes a la Faja Orogenica Araguaia (Neoproterozoico), que bordea el margen oriental del Craton de Amazonia en el estado de Para.", "nota": ""}, "NYB38": {"cod_ids": ["COD 9000791", "COD 9001030", "COD 9015964", "COD 9005629"], "minerales": ["Diopside", "Andesine", "Hematite", "Pigeonite"], "formulas": ["Ca0.87Mg0.94Mn0.19O6Si2", "Al0.735Ca0.24Na0.26O4Si1.265", "Fe2O3", "Ca0.15Mg1.85O6Si2"], "descripcion": "Muestra NYB38 (WCSU-05007). Clasificada preliminarmente como roca ignea de tipo andesita, localizada en Itaranga, Rio Uruguay, Estado de Rio Grande do Sul, Brasil (Latitud: -27.198883, Longitud: -53.730439), recolectada por C.T. Philbrick (5288) el 7 de enero de 1999 (asociada a muestras botanicas de Podostemum rutifolium). Registra un contenido geoquimico de SiO2 de 43.22%, Al2O3 de 13.68%, Fe2O3(T) de 14.95%, MnO de 0.21%, MgO de 6.46%, CaO de 7.49%, Na2O de 1.19% y K2O de 0.51%, con una perdida por calcinacion (LOI) de 8.84%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Diopside, Andesine, Hematite y Pigeonite.", "interpretacion": "Aunque la clasificacion preliminar de campo indica una andesita, la firma geoquimica de roca total define de forma estricta una composicion mafica compatible con un basalto o andesita basaltica primitiva de la serie toleiitica, caracterizada por un bajo contenido de SiO2 (43.22%) y concentraciones deprimidas de alcalis (Na2O: 1.19%, K2O: 0.51%). El ensamble magmatico primario esta constituido por plagioclasa intermedia (Andesine) y la coexistencia de dos piroxenos: clinopiroxeno calcico-magnesiano (Diopside) y un piroxeno pobre en calcio (Pigeonite), los cuales controlan directamente los contenidos elevados de MgO (6.46%) y CaO (7.49%). Los altos contenidos de Fe2O3(T) (14.95%) y TiO2 (2.36%) se reflejan mineralogicamente en la cristalizacion conspicua de Hematite (derivada de la oxidacion secundaria o magmatica de opacos) y el vanadio residual (V: 503 ppm). La elevada perdida por calcinacion (LOI: 8.84%) es una evidencia directa de procesos de alteracion hidrotermal superpuestos o meteorizacion intensa de la matriz volcanica. Georregionalmente, esta signatura magmatica basaltica toleiitica enriquecida en hierro corresponde a los flujos de lava de la Formacion Serra Geral (Cretacico Inferior), pertenecientes a la gran provincia magmatica del Parana en el sur de Brasil.", "nota": ""}, "NYB41": {"cod_ids": ["COD 9009666", "COD 9001031", "COD 9000701", "COD 9006348", "COD 9015696"], "minerales": ["Quartz", "Andesine", "Microcline", "Orthoclase", "Goethite"], "formulas": ["O2Si", "Al0.735Ca0.24Na0.26O4Si1.265", "AlKO8Si3", "AlKO8Si3", "FeO2"], "descripcion": "Muestra NYB41. No cuenta con clasificacion preliminar de campo ni analisis geoquimico de roca total disponible. Localizada en el Rio Camisa, Brasil (Latitud: -29.019733, Longitud: -50.2593), recolectada por Philbrick (5553) el 18 de enero de 1999 (asociada a muestras botanicas de Podostemum distichum). El analisis mineralogico por difraccion de rayos x (DRX) identifica de manera cuantitativa el ensamble compuesto por Quartz, Andesine, Microcline, Orthoclase y Goethite.", "interpretacion": "La parogenesis mineralogica determinada por DRX revela un marcado dominio de fases félsicas e intermedias, sugiriendo una litologia original de afinidad dacitica a riolitica, o bien un deposito sedimentario maduro derivado de estas (como una arenisca feldespatica o arcosa). El ensamble magmatico primario esta constituido por plagioclasa intermedia (Andesine) en coexistencia con dos polimorfos de feldespato potasico (Orthoclase de alta/media temperatura y Microcline de baja temperatura), acompañados de Quartz libre. La presencia conspicua de Goethite (un oxihidroxido de hierro hidratado secundario) es un indicador directo de un proceso superpuesto de alteracion meteórica intensa (intemperismo tropical) u oxidacion supérgena tardia, responsable del lavado y lixiviacion de fases ferromagnesianas primarias. Georregionalmente, la ubicacion en el estado de Rio Grande do Sul sitúa a la muestra dentro de las secuencias acidas superiores (facies volcanicas de tipo Palmas, ricas en riolitas y dacitas) que coronan la gran Provincia Magmatica del Parana (Cretacico Inferior).", "nota": ""}, "NYB42": {"cod_ids": ["COD 1011172", "COD 9002197", "COD 9004191", "COD 9000161", "COD 9001352"], "minerales": ["Quartz low", "Albite", "Microcline", "Orthoclase", "Biotite"], "formulas": ["O2Si", "AlNaO8Si3", "AlK0.95Na0.05O8Si3", "AlKO8Si3", "Al1.249Ca0.009Cr0.006Fe1.239K0.968Mg1.401Mn0.024Na0.02O12Si2.832Ti0.231"], "descripcion": "Muestra NYB42 (WCSU-05603). Clasificada preliminarmente como roca ignea de tipo granodiorita, localizada en Jose Raydan, Rio Felix, Estado de Minas Gerais, Brasil (Latitud: -18.198056, Longitud: -42.454167), recolectada por C.T. Philbrick (5746) el 26 de julio de 2002 (asociada a muestras botanicas de Podostemum scaturiginum). Registra un contenido geoquimico de SiO2 de 76.52%, Al2O3 de 12.83%, Fe2O3(T) de 1.54%, MnO de 0.04%, MgO de 0.33%, CaO de 1.50%, Na2O de 4.23% y K2O de 2.00%, con una perdida por calcinacion (LOI) de 0.89%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz low, Albite, Microcline, Orthoclase y Biotite.", "interpretacion": "A pesar de la clasificacion preliminar de granodiorita, la firma geoquimica de roca total define de forma estricta una composicion altamente acida e hiperalcalina compatible con un granito de alta silice o leucogranito, caracterizado por un elevado contenido de SiO2 (76.52%) y un fuerte dominio sodico (Na2O: 4.23%) frente a un K2O moderado (2.00%). El armazon tectosilicatado magmatico esta regido por la coexistencia de Quartz low, Albite pura y dos polimorfos de feldespato potasico (Orthoclase y Microcline), reflejando un sistema plutonico félsico evolucionado. Los escasos valores de Fe2O3(T) (1.54%), MgO (0.33%) y TiO2 (0.154%) se vinculan a una fraccion melanocratica muy deprimida constituida por Biotite titanifera, en cuya formula estructural especifica de DRX se constata ademas la incorporacion de trazas de cromo y manganeso. La baja perdida por calcinacion (LOI: 0.89%) ratifica la excelente preservacion del cuerpo cristalino y la ausencia de procesos de alteracion hidrotermal o meteórica. Tectono-estratigraficamente, este granitoide evolucionado post-orogenico es caracteristico de los complejos plutonicos neoproterozoicos (Ciclo Brasiliano) que intruyen las secuencias metamorficas de la Provincia Mantiqueira en la region oriental de Minas Gerais.", "nota": ""}, "NYB43": {"cod_ids": ["COD 1011172", "COD 9000785", "COD 9009233"], "minerales": ["Quartz low", "Albite", "Chamosite"], "formulas": ["O2Si", "Al1.005Na0.986O8Si2.995", "Al1.2Fe2.482H10Mg2.518O18Si3.8"], "descripcion": "Muestra NYB43 (1182033). Clasificada preliminarmente como roca ignea de tipo granito, localizada en Sao Joao e Araguaia, Estado de Tocantins, Brasil (Latitud: -5.342222, Longitud: -48.769167), recolectada por C.T. Philbrick (5842) el 12 de junio de 2005 (asociada a muestras botanicas de Castelnavia fluitans). Registra un contenido geoquimico de SiO2 de 88.41%, Al2O3 de 4.62%, Fe2O3(T) de 1.29%, MnO de 0.05%, MgO de 0.48%, CaO de 0.58%, Na2O de 2.25% y K2O de 0.10%, con una perdida por calcinacion (LOI) de 1.55%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz low, Albite y Chamosite.", "interpretacion": "A pesar de la clasificacion preliminar de granito, la geoquimica de roca total define una litologia extremadamente silicea (SiO2: 88.41%) con valores severamente deprimidos de aluminio (Al2O3: 4.62%) y potasio (K2O: 0.10%), lo que indica que la roca sufrio una intensa silicificacion y lixiviacion total de feldespatos potasicos primarios. El armazon mineralogico esta dominado por Quartz low hidrotermal coexistiendo con plagioclasa sodica pura residual o neoformada (Albite), la cual fija de forma estricta el Na2O (2.25%). El escaso contenido de Fe2O3(T) (1.29%) y MgO (0.48%) se vincula a una fase de alteracion hidrotermal en facies de esquistos verdes (alteracion propilitica), caracterizada por la neoformacion de Chamosite (clorita rica en hierro y magnesio) que aloja ademas el agua estructural asociada al LOI (1.55%). Tectono-estratigraficamente, esta signatura de fuerte metasomatismo de silice es tipica de zonas de cizalla o halos hidrotermales distales que afectaron a las unidades graníticas o metasedimentarias neoproterozoicas de la Faja Orogenica Araguaia, en el limite oriental del Craton de Amazonia en Tocantins.", "nota": ""}, "NYB44": {"cod_ids": ["COD 5000035", "COD 9016012", "COD 9000189", "COD 9009782"], "minerales": ["Quartz", "Muscovite", "Microcline", "Hematite"], "formulas": ["O2Si", "Al2.038Ba0.01Ca0.02Fe0.14H2K0.87Mg0.5Na0.07O12Si3.392Ti0.01", "Al0.93KO8Si3.07", "Fe2.03"], "descripcion": "Muestra NYB44 (WCSU-05463). No cuenta con clasificacion preliminar de campo disponible. Localizada en Norte Ladrea, Rio Santana, Estado de Mato Grosso, Brasil (Latitud: -14.454167, Longitud: -56.806944), recolectada por C.T. Philbrick (5970) el 18 de julio de 2006 (asociada a muestras botanicas de Apinagia riedelii). Registra un contenido geoquimico de SiO2 de 74.18%, Al2O3 de 9.42%, Fe2O3(T) de 6.99%, MnO de 0.29%, MgO de 0.85%, CaO de 0.10%, Na2O de 0.24% y K2O de 2.00%, con una perdida por calcinacion (LOI) de 4.08%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz, Muscovite, Microcline y Hematite.", "interpretacion": "El ensamble mineralogico por DRX y la signatura litoquimica definen una roca de caracteristica silicea dominante (SiO2: 74.18%) con un severo empobrecimiento de sodio (Na2O: 0.24%) y calcio (CaO: 0.10%), lo que descarta una afinidad magmatica primaria y sugiere un protolito de naturaleza sedimentaria clastica madura (meta-arenisca / cuarzoarenita) o bien una meta-riolita lixiviada. La mineralogia secundaria hidrotermal o metamorfica de bajo grado controla el quimismo restante: la presencia de Muscovite ferromagnesiana explica el contenido de K2O (2.00%), Al2O3 (9.42%) y la elevada perdida por calcinacion (LOI: 4.08%) debida a su agua estructural. Por su parte, el conspicuo contenido de Fe2O3(T) (6.99%) se valida directamente por la cristalizacion de Hematite, la cual actua como cemento o reemplazo supérgeno/hidrotermal. Tectono-estratigraficamente, la ubicacion en el estado de Mato Grosso asocia a esta muestra con las secuencias metasedimentarias e intrusivas deformadas pertenecientes a la Faja Orogenica Paraguay (Neoproterozoico), situadas en el margen meridional del Craton de Amazonia.", "nota": ""}, "NYB46": {"cod_ids": ["COD 9013321", "COD 9002197", "COD 9004191", "COD 9000844", "COD 9009233"], "minerales": ["Quartz", "Albite", "Microcline", "Biotite", "Chamosite"], "formulas": ["O2Si", "AlNaO8Si3", "AlK0.95Na0.05O8Si3", "Al3.3Fe3.512K2Mg7.164O48Si5.68Ti1.344", "Al1.2Fe2.482H10Mg2.518O18Si3.8"], "descripcion": "Muestra NYB46 (WCSu-04791). Clasificada preliminarmente como roca metamorfica de tipo ortogneis, localizada en el Rio Juruena, Estado de Mato Grosso, Brasil (Latitud: -10.375583, Longitud: -58.344917), recolectada por C.P. Bove (1917) el 28 de septiembre de 2007 (asociada a muestras botanicas de Castelnavia princeps). Registra un contenido geoquimico de SiO2 de 63.05%, Al2O3 de 16.84%, Fe2O3(T) de 3.82%, MnO de 0.17%, MgO de 0.42%, CaO de 1.01%, Na2O de 5.37% y K2O de 4.83%, con una perdida por calcinacion (LOI) de 2.48%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz, Albite, Microcline, Biotite y Chamosite.", "interpretacion": "La parogenesis mineralogica determinada por DRX es consistente con un ortogneis de composicion intermedia-felsica, derivado de un protolito plutonico de afinidad granodioritica a granitica calcoalcalina con base en su rango de silice (SiO2: 63.05%) y un elevado contenido de alcalis combinados (Na2O: 5.37%, K2O: 4.83%). Las bandas leucocraticas de segregacion metamorfica de alto grado estan dominadas por Albite, Microcline y Quartz libre, controlando el marcado aporte de Al2O3 (16.84%). La lineacion mafica o bandas melanocraticas estan estructuradas por Biotite magmatica-metamorfica, cuya formula cristaloquimica especifica de DRX revela una alta retencion de titanio, justificando el TiO2 de 0.365% y el bario residual (Ba: 1851 ppm). Se reconoce un proceso de alteracion retrograda superpuesto en facies de esquistos verdes, evidenciado por la neoformacion de Chamosite (clorita de hierro y magnesio) que reemplaza parcialmente a las micas primarias y aporta el agua estructural reflejada en el LOI (2.48%). Tectono-estratigraficamente, esta unidad representa el basamento paleoproterozoico de la Provincia Geocronologica Juruena (Craton de Amazonia) en el norte de Mato Grosso.", "nota": ""}, "NYB49": {"cod_ids": ["COD 5000035", "COD 9002306", "COD 9011422", "COD 9009233"], "minerales": ["Quartz", "Biotite", "Oligoclase", "Chamosite"], "formulas": ["O2Si", "Al1.9Fe1.44H1.54K0.95Mg0.84Na0.05O12Si2.64Ti0.16", "Al1.179Ca0.179Na0.821O8Si2.821", "Al1.2Fe2.482H10Mg2.518O18Si3.8"], "descripcion": "Muestra NYB49 (WCSU-05468). Clasificada como roca metamorfica, localizada en Caprado, Rio Sao Francisco, Estado de Pernambuco, Brasil (Latitud: -8.518611, Longitud: -39.326944), recolectada por C.P. Bove (2338) el 4 de julio de 2012 (asociada a muestras botanicas de Ceratolacis pedunculatum). Registra un contenido geoquimico de SiO2 de 64.30%, Al2O3 de 13.89%, Fe2O3(T) de 8.16%, MnO de 0.13%, MgO de 2.76%, CaO de 2.39%, Na2O de 2.58% y K2O de 2.16%, con una perdida por calcinacion (LOI) de 1.60%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz, Biotite, Oligoclase y Chamosite.", "interpretacion": "La parogenesis mineralogica determinada por DRX confirma una litologia metamorfica de grado medio compatible con un ortogneis de composicion intermedia (derivado de un protolito de cuarzodiorita o granodiorita). Geoquimicamente, el caracter siliceo moderado (SiO2: 64.30%) se ve reflejado en la coexistencia de Quartz libre y plagioclasa intermedia (Oligoclase), que controlan el balance de Al2O3 (13.89%) junto con los alcalis. Los valores marcadamente altos de Fe2O3(T) (8.16%), MgO (2.76%) y TiO2 (1.039%) estan controlados por la segregacion de micas y cloritas secundarias en las bandas melanocraticas, representadas por Biotite (cuya formula empirica por DRX confirma la retencion estructural de titanio) y Chamosite (clorita rica en hierro y magnesio). La presencia de Chamosite indica un proceso de alteracion retrograda superpuesto en facies de esquistos verdes, responsable del agua estructural asociada al LOI (1.60%). Tectono-estratigraficamente, esta unidad se asocia a los complejos ortogneisicos deformados del Neoproterozoico (Ciclo Brasiliano) que configuran el Dominio de Lineamientos Transversales dentro de la Provincia Borborema en el Estado de Pernambuco.", "nota": ""}, "NYB50": {"cod_ids": ["COD 9013321", "COD 9010407", "COD 9009230"], "minerales": ["Quartz", "Goethite", "Kaolinite"], "formulas": ["O2Si", "Co0.03Fe0.97HO2", "Al2H4O9Si2"], "descripcion": "Muestra NYB50 (WCSU-05471). Clasificada preliminarmente como roca sedimentaria de tipo cuarzoarenita, localizada en el Rio Paru, Estado de Para, Brasil (Latitud: -0.826335, Longitud: -53.23881), recolectada por C.P. Bove (2416) el 11 de septiembre de 2014 (asociada a muestras botanicas de Oserya pilgeri). Registra un contenido geoquimico de SiO2 de 89.83%, Al2O3 de 1.99%, Fe2O3(T) de 5.61%, MnO de 0.19%, MgO de 0.04%, CaO de 0.09%, Na2O de 0.10% y K2O de 0.05%, con una perdida por calcinacion (LOI) de 1.47%. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Quartz, Goethite y Kaolinite.", "interpretacion": "La parogenesis mineralogica determinada por DRX es consistente con una litologia sedimentaria detritica madura afectada por procesos supérgenos de meteorizacion tropical. El marcado predominio de SiO2 (89.83%) ratifica la clasificacion preliminar de cuarzoarenita, donde el armazon principal esta constituido por Quartz clastico. La descomposicion de feldespatos primarios genero una matriz arcillosa secundaria compuesta por Kaolinite, fase aluminosilicatada que controla el bajo contenido de Al2O3 (1.99%) y contribuye al LOI (1.47%) debido a sus grupos hidroxilo estructurales. Por su parte, la concentracion significativa de Fe2O3(T) (5.61%) esta directamente regulada por la cristalizacion de Goethite, un oxihidroxido ferrico secundario que actua como cemento de impregnacion o recubrimiento de granos. Tectono-estratigraficamente, esta unidad silicea representa los depositos de cobertura fanerozoica de la Cuenca del Amazonas o las secuencias sedimentarias proterozoicas del Escudo de Guayana que flanquean el margen septentrional del Rio Paru en el Estado de Para.", "nota": ""}, "NYB03": {"cod_ids": ["COD 9001031", "COD 9005337", "COD 9002316", "COD 9001243", "COD 9010424"], "minerales": ["Andesine", "Diopside-ferrian", "Magnetite", "Pargasite", "Orthopyroxene"], "formulas": ["Al0.735Ca0.24Na0.26O4Si1.265", "CaFe0.267Mg0.857O6Si1.876", "Fe3O4", "Al2.04Ca1.86Fe1.31H2Mg3.83Na2.28O24Si5.96", "Al0.236Ca0.01Fe0.967Mg0.923Mn0.016O6Si1.848"], "descripcion": "Muestra NYB03. Clasificada preliminarmente como roca ignea de tipo andesita, localizada en Rio Piedras 2, Panama (Latitud: 8.66884, Longitud: -82.58703), recolectada por A. Bedoya en enero de 2025 (asociada a muestras botanicas de Marathrum foeniculaceum & Tristicha trifaria). Esta muestra no cuenta con analisis geoquimico de roca total disponible. El analisis mineralogico por difraccion de rayos x (DRX) identifica la presencia cuantitativa del ensamble compuesto por Andesine, Diopside-ferrian, Magnetite, Pargasite y Orthopyroxene.", "interpretacion": "La parogenesis mineralogica determinada por DRX es completamente congruente con una litologia ignea efusiva a subvolcanica de composicion intermedia, validando la clasificacion preliminar de andesita. En ausencia de datos litoquimicos, la caracterizacion se restringe al analisis de sus fases cristalinas estables. El ensamble magmatico primario esta dominado por plagioclasa intermedia (Andesine) en equilibrio termodinamico con una fraccion máfica polifasica compleja. Esta incluye clinopiroxeno ferrico (Diopside-ferrian), ortopiroxeno (Orthopyroxene) y un anfibol calcico-sodico hidratado de alta temperatura (Pargasite), asociacion mineralogica tipica de magmas calcoalcalinos hidratados de arco volcanico. Como fase accesoria opaca se desarrolla Magnetite. Tectono-estratigraficamente, la ubicacion de la muestra (tierras altas/medias de la vertiente del Pacifico occidental panameño, Provincia de Chiriqui) encaja con las secuencias volcanicas andesiticas neogenas asociadas a la evolucion del arco magmatico de la Cordillera Central.", "nota": ""}};

/* geocoding */
const geocodeCache = {};
async function geocodeQuery(q){
  if(geocodeCache[q]!==undefined) return geocodeCache[q];
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`,{headers:{"Accept-Language":"es"}});
    if(!r.ok){geocodeCache[q]=null;return null;}
    const data=await r.json();
    if(data&&data.length){const res={lat:parseFloat(data[0].lat),lon:parseFloat(data[0].lon)};geocodeCache[q]=res;return res;}
    geocodeCache[q]=null;return null;
  }catch{geocodeCache[q]=null;return null;}
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function stripAdminPrefixes(t){return t.replace(/^(MUNICIPIO\s+DE|MUNICIPIO|PROVINCIA\s+DE|DEPARTAMENTO\s+DE|DISTRITO\s+DE|ESTADO\s+DE)\s+/i,"").trim();}
async function geocodeSample(ubicacion,pais){
  const tokensRaw=(ubicacion||"").split(",").map(t=>t.trim()).filter(Boolean);
  const tokens=tokensRaw.map(stripAdminPrefixes).filter(Boolean);
  const intentos=[];
  if(ubicacion&&pais) intentos.push(`${ubicacion}, ${pais}`);
  if(tokens.length>=2&&pais) intentos.push(`${tokens[tokens.length-1]}, ${tokens[0]}, ${pais}`);
  if(tokens.length>=1&&pais){intentos.push(`${tokens[tokens.length-1]}, ${pais}`);if(tokens[0]!==tokens[tokens.length-1]) intentos.push(`${tokens[0]}, ${pais}`);}
  if(pais) intentos.push(pais);
  for(const q of intentos){const r=await geocodeQuery(q);await sleep(1100);if(r) return r;}
  return null;
}

      <div class="${tieneGeoq?'analysis':'analysis-no'}">

}

async function init(){
  const loadingBar=document.getElementById("loadingBar");
  const pending=[];
  samples.forEach(s=>{
    const lat=parseCoord(s.LATITUD),lon=parseCoord(s.LONGITUD);
    if(lat!==null&&lon!==null){countOriginal++;addSampleMarker(s,lat,lon,false);}
    else if(COORD_FALLBACK[s.UNINORTE_CODE]){
      const fb=COORD_FALLBACK[s.UNINORTE_CODE];
      countGeocoded++;addSampleMarker(s,fb.lat,fb.lon,true);
    } else pending.push(s);
  });
  updateCounter();
  populateFilterOptions();
  if(pending.length){
    loadingBar.style.display="block";
    for(let i=0;i<pending.length;i++){
      const s=pending[i];
      loadingBar.textContent=`Geocodificando (${i+1}/${pending.length}) — ${s.UNINORTE_CODE}`;
      const r=await geocodeSample(s.UBICACION,s.PAIS);
      if(r){countGeocoded++;addSampleMarker(s,r.lat,r.lon,true);}
      else{countUnlocated++;unlocatedList.push({code:s.UNINORTE_CODE,pais:s.PAIS,ubicacion:s.UBICACION});}
      updateCounter();renderUnlocatedPanel();
    }
    loadingBar.style.display="none";
  }
}

function uniqueSorted(arr){return[...new Set(arr.filter(v=>nonEmpty(v)))].sort();}
function fillSelect(id,vals){
  const sel=document.getElementById(id);
  vals.forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;sel.appendChild(o);});
}
function populateFilterOptions(){
  fillSelect("fPais",uniqueSorted(samples.map(s=>s.PAIS)));
  fillSelect("fTipo",uniqueSorted(samples.map(s=>s.TIPO_ROCA)));
  fillSelect("fAutor",uniqueSorted(samples.map(s=>cleanAuthor(s.AUTOR))));
  fillSelect("fSpp",uniqueSorted(samples.map(s=>s.SPP)));
}
function applyFilters(){
  const code=document.getElementById("searchCode").value.trim().toUpperCase();
  const pais=document.getElementById("fPais").value;
  const tipo=document.getElementById("fTipo").value;
  const autor=document.getElementById("fAutor").value;
  const spp=document.getElementById("fSpp").value;
  const onlyDRX=document.getElementById("fDRX").checked;
  const onlyGeo=document.getElementById("fGeo").checked;
  const onlyPetro=document.getElementById("fPetro").checked;
  markerCluster.clearLayers();
  markerRecords.forEach(rec=>{
    const s=rec.sample;let v=true;
    if(code && !String(s.UNINORTE_CODE||"").toUpperCase().includes(code)) v=false;
    if(pais && s.PAIS!==pais) v=false;
    if(tipo && s.TIPO_ROCA!==tipo) v=false;
    if(autor && cleanAuthor(s.AUTOR)!==autor) v=false;
    if(spp && s.SPP!==spp) v=false;
    if(onlyDRX && !nonEmpty(s.DRX)) v=false;
    if(onlyGeo && !nonEmpty(s.GEOQUIMICA)) v=false;
    if(onlyPetro && (nonEmpty(s.DRX)||nonEmpty(s.GEOQUIMICA))) v=false;
    if(v) markerCluster.addLayer(rec.marker);
  });
}
